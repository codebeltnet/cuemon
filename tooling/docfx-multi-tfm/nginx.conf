# Generated into the temporary workspace by Build-DocfxFrameworkViews.ps1.
map $arg_view $framework_root {
    default invalid;
    "" "";
__VIEWS__
}

map $search_directory $search_root {
    default invalid;
__SEARCH__
}

map $status $fingerprinted_asset_cache_control {
    default "no-store";
    ~^2 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Expires "0" always;
    add_header Pragma "no-cache" always;
    add_header Vary "Accept-Encoding" always;

    location ^~ __API__ {
        if ($framework_root = invalid) { return 400 "Unknown documentation view."; }
        try_files $framework_root$uri =404;
    }
    location = /xrefmap.yml {
        if ($framework_root = invalid) { return 400 "Unknown documentation view."; }
        try_files $framework_root$uri =404;
    }

    location ^~ /_frameworks/ { internal; }

    # DocFX's module worker resolves ../index.json from its own URL.
    # Its scripts come from the same shared public directory as the page scripts.
    location ~ ^/_framework-search/(?<search_directory>[^/]+)/index\.json$ {
        if ($search_root = invalid) { return 404; }
        try_files $search_root/index.json =404;
    }
    location ~ ^/_framework-search/(?<search_directory>[^/]+)/public/(?<search_asset>[^/]+)$ {
        if ($search_root = invalid) { return 404; }
        rewrite ^ /public/$search_asset last;
    }
    location /_framework-search/ { return 404; }

    location ~ "^/public/.+-[A-Z0-9]{8}(?:-[A-Z0-9]{8})?(?:\.min)?\.(?:(?:css|js)(?:\.map)?|woff2?)$" {
        try_files $uri =404;
        etag on;
        if_modified_since exact;
        max_ranges 0;
        add_header Cache-Control $fingerprinted_asset_cache_control always;
        add_header Vary "Accept-Encoding" always;
    }
    location / { try_files $uri $uri/ =404; }
}
