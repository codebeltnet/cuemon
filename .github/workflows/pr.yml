name: PR Flow
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_mac_tests:
        type: boolean
        description: Run the macOS test matrix despite the additional cost and runtime.
        default: false
      run_docfx_framework_views:
        type: boolean
        description: Run the experimental DocFX framework-view fixture.
        default: false

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: PR proof
    uses: ./.github/workflows/verify.yml
    with:
      run-mac-tests: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mac_tests }}
    permissions:
      contents: read
      security-events: write
    secrets:
      GCP_TOKEN: ${{ secrets.GCP_TOKEN }}
      GCP_BUCKETNAME: ${{ secrets.GCP_BUCKETNAME }}
      SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
      DB_ADVENTUREWORKS: ${{ secrets.DB_ADVENTUREWORKS }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docfx_validation:
    name: DocFX run-actions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1

      - name: Generate, validate, and verify deterministic run-action scripts
        shell: pwsh
        run: |
          & ./.docfx/BuildRunActions.ps1
          & ./.docfx/TestRunActions.ps1 -CheckDeterminism

      - name: Verify Docker build context preserves run-action scripts
        shell: bash
        run: |
          set -euo pipefail
          tmp_dockerfile="$(mktemp)"
          trap 'rm -f "$tmp_dockerfile"' EXIT
          cat <<'EOF' > "$tmp_dockerfile"
          FROM dhi.io/nginx:1.31-alpine
          WORKDIR /build/docfx
          COPY . .
          RUN test ! -e BuildRunActions.ps1 && test ! -e BuildDocfxImage.ps1 && sh ./verify-docfx-site.sh --context .
          EOF
          docker build --no-cache -f "$tmp_dockerfile" .docfx

  docfx_framework_views:
    name: DocFX framework views (${{ matrix.os }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_docfx_framework_views }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1

      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      - name: Build and validate the framework fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP 'framework-tools'
          dotnet tool install --tool-path $tools docfx --version 2.81.0
          $env:PATH = "$tools$([IO.Path]::PathSeparator)$env:PATH"
          $output = Join-Path $env:RUNNER_TEMP 'framework-views'
          & ./tooling/docfx-multi-tfm/Build-DocfxFrameworkViews.ps1 -OutputRoot $output -TestSharedImplementation
          if ($IsLinux) {
              $browserTools = Join-Path $env:RUNNER_TEMP 'framework-browser'
              npm install --prefix $browserTools playwright@1.61.1
              node "$browserTools/node_modules/playwright/cli.js" install --with-deps chromium
              $env:NODE_PATH = "$browserTools/node_modules"
              & ./tooling/docfx-multi-tfm/Test-DocfxFrameworkViews.ps1 -Workspace $output -Browser
          }

  # Keep the existing aggregate required-check name for branch protection.
  pr_quality_gate:
    if: ${{ always() }}
    name: PR quality gate
    needs: [verification, docfx_validation]
    runs-on: ubuntu-26.04
    steps:
      - name: Evaluate PR proof
        shell: bash
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          DOCFX_VALIDATION_RESULT: ${{ needs.docfx_validation.result }}
        run: |
          if [[ "$VERIFICATION_RESULT" != "success" ]]; then
            echo "::error::PR verification finished with '$VERIFICATION_RESULT'."
            exit 1
          fi
          if [[ "$DOCFX_VALIDATION_RESULT" != "success" ]]; then
            echo "::error::DocFX run-actions validation finished with '$DOCFX_VALIDATION_RESULT'."
            exit 1
          fi
