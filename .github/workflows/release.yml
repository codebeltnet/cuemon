name: Release Flow
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: cuemon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_preflight:
    name: Validate release tag and authoritative main history
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      # git-checkout fetches full history and tags for MinVer and ancestry validation.
      - name: Checkout the triggering SHA
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ github.sha }}

      - id: validate
        name: Validate authoritative release request
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "::error::Release must be triggered by a Git tag; received '$RELEASE_REF'."
            exit 1
          fi
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must have the v prefix (for example, v10.7.2)."
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          semver_regex='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if [[ ! "$RELEASE_VERSION" =~ $semver_regex ]]; then
            echo "::error::'$RELEASE_VERSION' is not a supported SemVer release version. Use x.y.z or x.y.z-prerelease without build metadata."
            exit 1
          fi

          if ! tagged_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null)"; then
            echo "::error::Triggering tag '$RELEASE_TAG' is missing or does not resolve to a Git commit."
            exit 1
          fi
          if ! event_sha="$(git rev-parse --verify "$RELEASE_SHA^{commit}" 2>/dev/null)"; then
            echo "::error::Triggering SHA '$RELEASE_SHA' does not resolve to a Git commit."
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$tagged_sha" != "$event_sha" || "$checked_out_sha" != "$event_sha" ]]; then
            echo "::error::Tag '$RELEASE_TAG' resolves to '$tagged_sha', checkout to '$checked_out_sha', and triggering commit to '$event_sha'. The tag may have moved; restore the original tag before retrying."
            exit 1
          fi
          RELEASE_SHA="$tagged_sha"

          if ! git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'; then
            echo "::error::Could not fetch authoritative main history to validate '$RELEASE_TAG'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "::error::Tagged commit '$RELEASE_SHA' is not reachable from authoritative main. Tag a commit in main history."
            exit 1
          fi

          set +e
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"
          release_status=$?
          set -e
          if [[ "$release_status" -eq 0 ]]; then
            expected_prerelease=false
            if [[ "$RELEASE_VERSION" == *-* ]]; then expected_prerelease=true; fi
            if ! jq -e --arg tag "$RELEASE_TAG" --argjson prerelease "$expected_prerelease" \
              '.tag_name == $tag and .prerelease == $prerelease and (.draft | type == "boolean")' <<< "$release_json" > /dev/null; then
              echo "::error::Existing GitHub Release conflicts with tag '$RELEASE_TAG' or its prerelease identity. Review the existing release before retrying."
              exit 1
            fi
            echo "Compatible GitHub Release '$RELEASE_TAG' already exists; retaining its draft/published state."
          elif [[ "$release_json" != *"HTTP 404"* ]]; then
            echo "::error::Could not check GitHub Release '$RELEASE_TAG'."
            echo "$release_json"
            exit 1
          fi

          {
            echo "version=$RELEASE_VERSION"
            echo "tag=$RELEASE_TAG"
            echo "sha=$RELEASE_SHA"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release request validated"
            echo
            printf -- '- Tag: `%s`\n' "$RELEASE_TAG"
            printf -- '- Version: `%s`\n' "$RELEASE_VERSION"
            echo '- Source: main'
            printf -- '- Released SHA: `%s`\n' "$RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  release_packages:
    name: Build and validate Release packages
    needs: [release_preflight]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the released SHA
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ needs.release_preflight.outputs.sha }}

      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      - name: Download the strong-name signing key
        uses: codebeltnet/gcp-download-file@v1
        with:
          serviceAccountKey: ${{ secrets.GCP_TOKEN }}
          bucketName: ${{ secrets.GCP_BUCKETNAME }}
          objectName: cuemon.snk

      - name: Verify signing key is present
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s cuemon.snk ]]; then
            echo "::error::The strong-name key 'cuemon.snk' was not downloaded."
            exit 1
          fi

      - name: Restore Release dependencies
        uses: codebeltnet/dotnet-restore@v3

      - name: Build Release packages from the exact SHA
        uses: codebeltnet/dotnet-build@v4
        with:
          configuration: Release

      - name: Pack Release packages
        uses: codebeltnet/dotnet-pack@v3
        with:
          configuration: Release

      - name: Validate package versions and existing NuGet content
        uses: codebeltnet/nuget-release-validate@v1
        with:
          package-directory: ${{ runner.temp }}/.nuget
          version: ${{ needs.release_preflight.outputs.version }}
          install-dotnet: 'false'
      - name: Persist validated NuGet packages for protected publication
        uses: actions/upload-artifact@v7
        with:
          name: NuGet-Release
          path: ${{ runner.temp }}/.nuget
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  publish_nuget:
    name: Publish NuGet v${{ needs.release_preflight.outputs.version }}
    needs: [release_preflight, release_packages]
    uses: codebeltnet/jobs-nuget-push/.github/workflows/default.yml@v3
    with:
      version: ${{ needs.release_preflight.outputs.version }}
      environment: Production
      configuration: Release
      download-build-artifact-name: NuGet-Release
    permissions:
      contents: read
      packages: write
    secrets:
      NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}

  draft_github_release:
    name: Create draft GitHub Release for the existing tag
    needs: [release_preflight, release_packages, publish_nuget]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout the released SHA
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ needs.release_preflight.outputs.sha }}

      - name: Verify the existing release tag still identifies the released SHA
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release_preflight.outputs.tag }}
          RELEASE_SHA: ${{ needs.release_preflight.outputs.sha }}
        run: |
          set -euo pipefail
          if ! tagged_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null)"; then
            echo "::error::Release tag '$RELEASE_TAG' is missing or does not resolve to a commit; restore the original tag before retrying."
            exit 1
          fi
          if [[ "$tagged_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::Tag '$RELEASE_TAG' points to '$tagged_sha', not released SHA '$RELEASE_SHA'. Restore the original tag before retrying."
            exit 1
          fi

      - name: Create or verify the draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release_preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.release_preflight.outputs.tag }}
        run: |
          set -euo pipefail

          set +e
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"
          release_status=$?
          set -e

          if [[ "$release_status" -eq 0 ]]; then
            release_tag="$(jq -r '.tag_name' <<< "$release_json")"
            if [[ "$release_tag" != "$RELEASE_TAG" ]]; then
              echo "::error::GitHub returned release '$release_tag' for requested tag '$RELEASE_TAG'."
              exit 1
            fi
            echo "GitHub Release '$RELEASE_TAG' already exists; retaining its current draft/published state."
            exit 0
          fi

          if [[ "$release_json" != *"HTTP 404"* ]]; then
            echo "::error::Could not check GitHub Release '$RELEASE_TAG'."
            echo "$release_json"
            exit 1
          fi

          release_args=(--draft --verify-tag --title "Cuemon $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${release_args[@]}"

  docfx_oci_build:
    name: Build multi-platform DocFX OCI artifact once
    needs: [release_preflight, publish_nuget]
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout the released SHA
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ needs.release_preflight.outputs.sha }}

      - name: Download strong-name key for DocFX metadata compilation
        uses: codebeltnet/gcp-download-file@v1
        with:
          serviceAccountKey: ${{ secrets.GCP_TOKEN }}
          bucketName: ${{ secrets.GCP_BUCKETNAME }}
          objectName: cuemon.snk

      - name: Verify signing key is present for DocFX metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s cuemon.snk ]]; then
            echo "::error::The strong-name key 'cuemon.snk' was not downloaded for DocFX metadata compilation."
            exit 1
          fi

      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      - name: Build and verify the multi-platform DocFX OCI artifact
        uses: codebeltnet/docfx-oci-build@v1
        with:
          version: ${{ needs.release_preflight.outputs.version }}
          revision: ${{ needs.release_preflight.outputs.sha }}
          output-path: ${{ runner.temp }}/cuemon-docfx-${{ needs.release_preflight.outputs.version }}.oci.tar
          docfx-version: 2.78.5
          platforms: linux/amd64,linux/arm64

      - name: Persist OCI image between release jobs
        uses: actions/upload-artifact@v7
        with:
          name: DocFX-OCI-${{ needs.release_preflight.outputs.version }}
          path: |
            ${{ runner.temp }}/cuemon-docfx-${{ needs.release_preflight.outputs.version }}.oci.tar
            ${{ runner.temp }}/cuemon-docfx-${{ needs.release_preflight.outputs.version }}.oci.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  upload_docfx_release_asset:
    name: Attach the built DocFX OCI artifact to its release
    needs: [release_preflight, draft_github_release, docfx_oci_build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download the already-built OCI artifact
        uses: actions/download-artifact@v8
        with:
          name: DocFX-OCI-${{ needs.release_preflight.outputs.version }}
          path: ${{ runner.temp }}/docfx-release-asset

      - name: Revalidate transferred OCI artifact
        uses: codebeltnet/oci-artifact-verify@v1
        with:
          archive-path: ${{ runner.temp }}/docfx-release-asset/cuemon-docfx-${{ needs.release_preflight.outputs.version }}.oci.tar
          checksum-path: ${{ runner.temp }}/docfx-release-asset/cuemon-docfx-${{ needs.release_preflight.outputs.version }}.oci.tar.sha256
          version: ${{ needs.release_preflight.outputs.version }}
          revision: ${{ needs.release_preflight.outputs.sha }}

      - name: Upload immutable image and checksum assets to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release_preflight.outputs.version }}
          RELEASE_TAG: ${{ needs.release_preflight.outputs.tag }}
        run: |
          set -euo pipefail

          archive_name="cuemon-docfx-$RELEASE_VERSION.oci.tar"
          checksum_name="$archive_name.sha256"
          archive="$RUNNER_TEMP/docfx-release-asset/$archive_name"
          checksum="$RUNNER_TEMP/docfx-release-asset/$checksum_name"
          existing_dir="$RUNNER_TEMP/existing-docfx-assets"
          mkdir -p "$existing_dir"

          asset_names="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name')"
          has_archive=false
          has_checksum=false
          if grep -Fxq "$archive_name" <<< "$asset_names"; then has_archive=true; fi
          if grep -Fxq "$checksum_name" <<< "$asset_names"; then has_checksum=true; fi

          if [[ "$has_archive" == "true" ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive_name" --dir "$existing_dir"
            if ! cmp -s "$archive" "$existing_dir/$archive_name"; then
              echo "::error::Release asset '$archive_name' already exists with different bytes; refusing to overwrite it."
              exit 1
            fi
          fi

          if [[ "$has_checksum" == "true" ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$checksum_name" --dir "$existing_dir"
            if ! cmp -s "$checksum" "$existing_dir/$checksum_name"; then
              echo "::error::Release asset '$checksum_name' already exists with different bytes; refusing to overwrite it."
              exit 1
            fi
          fi

          if [[ "$has_archive" == "false" && "$has_checksum" == "false" ]]; then
            gh release upload "$RELEASE_TAG" "$archive" "$checksum" --repo "$GITHUB_REPOSITORY"
          elif [[ "$has_archive" == "true" && "$has_checksum" == "false" ]]; then
            gh release upload "$RELEASE_TAG" "$checksum" --repo "$GITHUB_REPOSITORY"
          elif [[ "$has_archive" == "false" && "$has_checksum" == "true" ]]; then
            gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY"
          else
            echo "The exact versioned OCI archive and checksum are already attached to '$RELEASE_TAG'."
          fi

  publish_github_release:
    name: Publish GitHub Release after the OCI asset is attached
    needs: [release_preflight, upload_docfx_release_asset]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Publish the versioned GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_preflight.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          release_id="$(jq -r '.id' <<< "$release_json")"
          is_draft="$(jq -r '.draft' <<< "$release_json")"
          if [[ "$is_draft" == "false" ]]; then
            echo "GitHub Release '$RELEASE_TAG' is already published."
            exit 0
          fi
          if [[ "$is_draft" != "true" || ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub Release '$RELEASE_TAG' is not in a publishable draft state."
            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false

  prepare_release_tests:
    name: Discover post-release test projects
    needs: [release_preflight, publish_nuget]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      json: ${{ steps.test-projects.outputs.result }}
    steps:
      - name: Checkout the released SHA
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ needs.release_preflight.outputs.sha }}

      - id: test-projects
        name: Generate matrix for test projects
        uses: codebeltnet/shell-globbing@v2
        with:
          pattern: |
            test/**/*.csproj
            !test/**/Cuemon.Data.SqlClient.Tests.csproj

      - name: JSON output
        run: echo "${{ steps.test-projects.outputs.result }}"

  post_release_tests:
    name: Post-release Release tests - ${{ matrix.project }}
    needs: [release_preflight, prepare_release_tests, publish_nuget]
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.prepare_release_tests.outputs.json) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the released SHA
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ needs.release_preflight.outputs.sha }}

      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      - name: Install .NET Tool - Report Generator
        uses: codebeltnet/dotnet-tool-install-reportgenerator@v1

      - name: Test Release project with xUnit v3 and coverage
        uses: codebeltnet/dotnet-test@v4
        with:
          projects: ${{ matrix.project }}
          configuration: Release
          build: true
          restore: true
          build-switches: -p:SkipSignAssembly=true

      - name: Upload post-release test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-Release-${{ strategy.job-index }}
          path: ${{ runner.temp }}/TestResults
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

  post_release_integration_test:
    name: Post-release SQL Server integration test
    needs: [release_preflight, publish_nuget]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the released SHA
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ needs.release_preflight.outputs.sha }}

      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      - name: Install .NET Tool - Report Generator
        uses: codebeltnet/dotnet-tool-install-reportgenerator@v1

      - name: Spin up SQL Server test dependency
        uses: codebeltnet/docker-compose@v1
        with:
          command: up
          options: --wait
        env:
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}

      - name: Run SQL Server integration tests from the released SHA
        uses: codebeltnet/dotnet-test@v4
        with:
          projects: test/**/Cuemon.Data.SqlClient.Tests.csproj
          configuration: Release
          build: true
          restore: true
          build-switches: -p:SkipSignAssembly=true
        env:
          CONNECTIONSTRINGS__ADVENTUREWORKS: ${{ secrets.DB_ADVENTUREWORKS }}

      - name: Upload SQL Server test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-Release-SqlServer
          path: ${{ runner.temp }}/TestResults
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30

      - name: Take down SQL Server test dependency
        if: always()
        uses: codebeltnet/docker-compose@v1
        with:
          command: down

  post_release_sonarcloud:
    if: ${{ always() && needs.publish_nuget.result == 'success' }}
    name: Post-release SonarCloud analysis
    needs: [release_preflight, publish_nuget, prepare_release_tests, post_release_tests, post_release_integration_test]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the released SHA as main analysis
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ needs.release_preflight.outputs.sha }}

      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      - name: Install .NET Tool - Sonar Scanner
        uses: codebeltnet/dotnet-tool-install-sonarscanner@v3

      - name: Restore released source dependencies
        uses: codebeltnet/dotnet-restore@v3

      - name: Begin SonarCloud analysis for the released version
        uses: codebeltnet/sonarcloud-scan@v2
        with:
          token: ${{ secrets.SONAR_TOKEN }}
          organization: geekle
          projectKey: Cuemon
          version: ${{ needs.release_preflight.outputs.version }}

      - name: Build released source for SonarCloud
        uses: codebeltnet/dotnet-build@v4
        with:
          configuration: Release
          build-switches: -p:SkipSignAssembly=true

      - name: Finalize SonarCloud analysis
        uses: codebeltnet/sonarcloud-scan-finalize@v1
        with:
          token: ${{ secrets.SONAR_TOKEN }}

  post_release_codecov:
    if: ${{ always() && needs.publish_nuget.result == 'success' }}
    name: Post-release Codecov upload
    needs: [release_preflight, publish_nuget, prepare_release_tests, post_release_tests, post_release_integration_test]
    permissions:
      contents: read
    uses: codebeltnet/jobs-codecov/.github/workflows/default.yml@v1
    with:
      repository: codebeltnet/cuemon
      configuration: .github/codecov.yml
      ref: ${{ needs.release_preflight.outputs.sha }}
    secrets: inherit

  post_release_codeql:
    if: ${{ always() && needs.publish_nuget.result == 'success' }}
    name: Post-release CodeQL analysis
    needs: [release_preflight, publish_nuget, prepare_release_tests, post_release_tests, post_release_integration_test]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout the released SHA as main analysis
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ needs.release_preflight.outputs.sha }}

      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      - name: Restore released source dependencies
        uses: codebeltnet/dotnet-restore@v3

      - name: Begin CodeQL analysis
        uses: codebeltnet/codeql-scan@v1

      - name: Build released source for CodeQL
        uses: codebeltnet/dotnet-build@v4
        with:
          configuration: Release
          build-switches: -p:SkipSignAssembly=true

      - name: Finalize CodeQL analysis
        uses: codebeltnet/codeql-scan-finalize@v1

  release_summary:
    if: ${{ always() }}
    name: Release and post-release status
    needs:
      - release_preflight
      - release_packages
      - publish_nuget
      - draft_github_release
      - docfx_oci_build
      - upload_docfx_release_asset
      - publish_github_release
      - prepare_release_tests
      - post_release_tests
      - post_release_integration_test
      - post_release_sonarcloud
      - post_release_codecov
      - post_release_codeql
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Report release and assurance status
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.release_preflight.result }}
          RELEASE_VERSION: ${{ needs.release_preflight.outputs.version }}
          RELEASE_SHA: ${{ needs.release_preflight.outputs.sha }}
          RELEASE_TAG: ${{ needs.release_preflight.outputs.tag }}
          PACKAGE_BUILD_RESULT: ${{ needs.release_packages.result }}
          NUGET_RESULT: ${{ needs.publish_nuget.result }}
          DRAFT_RELEASE_RESULT: ${{ needs.draft_github_release.result }}
          DOCFX_BUILD_RESULT: ${{ needs.docfx_oci_build.result }}
          DOCFX_ASSET_RESULT: ${{ needs.upload_docfx_release_asset.result }}
          GITHUB_RELEASE_RESULT: ${{ needs.publish_github_release.result }}
          TEST_DISCOVERY_RESULT: ${{ needs.prepare_release_tests.result }}
          TEST_RESULT: ${{ needs.post_release_tests.result }}
          INTEGRATION_RESULT: ${{ needs.post_release_integration_test.result }}
          SONAR_RESULT: ${{ needs.post_release_sonarcloud.result }}
          CODECOV_RESULT: ${{ needs.post_release_codecov.result }}
          CODEQL_RESULT: ${{ needs.post_release_codeql.result }}
        run: |
          set -euo pipefail

          {
            echo "## Cuemon release status"
            echo
            echo "- Tag: \`${RELEASE_TAG:-not validated}\`"
            echo "- Version: \`${RELEASE_VERSION:-not validated}\`"
            echo "- Released SHA: \`${RELEASE_SHA:-not validated}\`"
            echo "- Release package build: \`$PACKAGE_BUILD_RESULT\`"
            echo "- NuGet publication: \`$NUGET_RESULT\`"
            echo "- Draft GitHub Release: \`$DRAFT_RELEASE_RESULT\`"
            echo "- DocFX OCI build: \`$DOCFX_BUILD_RESULT\`"
            echo "- DocFX release asset: \`$DOCFX_ASSET_RESULT\`"
            echo "- Published GitHub Release: \`$GITHUB_RELEASE_RESULT\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$PREFLIGHT_RESULT" != "success" ]]; then
            {
              echo "No release was attempted because the triggering tag, SemVer, main ancestry or existing release identity failed preflight validation."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PACKAGE_BUILD_RESULT" != "success" ]]; then
            {
              echo "NuGet publication did not start because the Release package build or package validation failed."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$NUGET_RESULT" == "skipped" ]]; then
            {
              echo "NuGet publication did not start. Check the protected Production environment decision or workflow dependency state."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$NUGET_RESULT" != "success" ]]; then
            {
              echo "NuGet publication did not complete. If the sequential push started, it may already have published some packages. Re-run the failed NuGet publication job on this workflow run to reuse the validated artifact; do not start a fresh run with the same version unless the packages' SHA-512 values match."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DRAFT_RELEASE_RESULT" != "success" ]]; then
            {
              echo "NuGet packages were published, but draft GitHub Release creation did not complete. Check the existing tag and release before retrying; GitHub and NuGet publication cannot be committed transactionally."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$DOCFX_BUILD_RESULT" != "success" || "$DOCFX_ASSET_RESULT" != "success" ]]; then
            {
              echo "NuGet packages were published for the existing source tag, but the DocFX OCI artifact or release asset upload failed. GitHub Release publication waits for the verified OCI archive and checksum, so the draft remains unpublished."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$GITHUB_RELEASE_RESULT" != "success" ]]; then
            {
              echo "NuGet packages, the source tag and the OCI release assets are ready, but GitHub Release publication failed or could not be confirmed. Check whether the release is still a draft before retrying the idempotent publish job."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$NUGET_RESULT" == "success" && \
                ( "$TEST_DISCOVERY_RESULT" != "success" || "$TEST_RESULT" != "success" || \
                  "$INTEGRATION_RESULT" != "success" || "$SONAR_RESULT" != "success" || \
                  "$CODECOV_RESULT" != "success" || "$CODEQL_RESULT" != "success" ) ]]; then
            echo "::warning::Product release succeeded; post-release assurance failed."
            {
              echo
              echo "**Product release succeeded; post-release assurance failed.**"
              echo
              echo "Post-release test discovery: \`$TEST_DISCOVERY_RESULT\`; test matrix: \`$TEST_RESULT\`; SQL Server integration: \`$INTEGRATION_RESULT\`; SonarCloud: \`$SONAR_RESULT\`; Codecov: \`$CODECOV_RESULT\`; CodeQL: \`$CODEQL_RESULT\`."
              echo "The package and tag remain released. These findings do not roll back publication; resolve them against the recorded SHA."
            } >> "$GITHUB_STEP_SUMMARY"
          fi


