name: Shared Verification
on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: Exact source SHA for release assurance; empty retains PR checkout behavior.
        default: ''
      version:
        type: string
        description: Released SemVer for canonical main; empty uses the build's MinVer version.
        default: ''
      canonical-main:
        type: boolean
        description: Report main health at ref rather than the triggering PR identity.
        default: false
      run-mac-tests:
        type: boolean
        description: Opt in to the macOS matrix, consistently for PR and assurance replay.
        default: false
    secrets:
      GCP_TOKEN:
        required: false
      GCP_BUCKETNAME:
        required: false
      SA_PASSWORD:
        required: false
      DB_ADVENTUREWORKS:
        required: false
      SONAR_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

# One verification definition: production packages and immutable assets are caller-owned.
jobs:
  init:
    name: initialize
    runs-on: ubuntu-26.04
    outputs:
      run-privileged-jobs: ${{ steps.vars.outputs.run-privileged-jobs }}
      run-mac-tests: ${{ steps.vars.outputs.run-mac-tests }}
      strong-name-key-filename: ${{ steps.vars.outputs.strong-name-key-filename }}
      build-switches: ${{ steps.vars.outputs.build-switches }}
    steps:
      - id: vars
        name: calculate workflow variables
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          RUN_MAC_TESTS: ${{ inputs.run-mac-tests }}
          CANONICAL_MAIN: ${{ inputs.canonical-main }}
          SOURCE_REF: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$CANONICAL_MAIN" == "true" ]]; then
            if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ || -z "$RELEASE_VERSION" ||
                  ( "$EVENT_NAME" != "push" && "$EVENT_NAME" != "workflow_dispatch" ) ||
                  ( "$EVENT_NAME" == "push" && "$WORKFLOW_REF" != refs/tags/v* ) ||
                  ( "$EVENT_NAME" == "workflow_dispatch" && "$WORKFLOW_REF" != "refs/heads/main" ) ]]; then
              echo '::error::Canonical main assurance requires a validated release SHA/version and a tag push or main dispatch.'
              exit 1
            fi
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$RUN_MAC_TESTS" == "true" ]]; then
            echo "run-mac-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-mac-tests=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$REPOSITORY" ]]; then
            echo "run-privileged-jobs=false" >> "$GITHUB_OUTPUT"
            echo "strong-name-key-filename=" >> "$GITHUB_OUTPUT"
            echo "build-switches=-p:SkipSignAssembly=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-privileged-jobs=true" >> "$GITHUB_OUTPUT"
            echo "strong-name-key-filename=cuemon.snk" >> "$GITHUB_OUTPUT"
            echo "build-switches=" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "run-privileged-jobs=false" >> "$GITHUB_OUTPUT"
            echo "strong-name-key-filename=" >> "$GITHUB_OUTPUT"
            echo "build-switches=-p:SkipSignAssembly=true" >> "$GITHUB_OUTPUT"
          fi

  prepare_test:
    name: 📜 Prepare Test
    needs: [init]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      json: ${{ steps.test-projects.outputs.result }}
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - id: test-projects
        name: Generate matrix for test projects
        uses: codebeltnet/shell-globbing@v2
        with:
          pattern: |
            test/**/*.csproj
            !test/**/Cuemon.Data.SqlClient.Tests.csproj

      - name: JSON output
        run: echo "${{ steps.test-projects.outputs.result }}"

  build:
    name: call-build
    needs: [init]
    strategy:
      matrix:
        arch: [X64, ARM64]
        configuration: [Debug, Release]
    uses: codebeltnet/jobs-dotnet-build/.github/workflows/default.yml@v3
    with:
      ref: ${{ inputs.ref }}
      configuration: ${{ matrix.configuration }}
      strong-name-key-filename: ${{ needs.init.outputs.strong-name-key-filename }}
      build-switches: ${{ needs.init.outputs.build-switches }}
      runs-on: ${{ matrix.arch == 'ARM64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
      upload-build-artifact-name: build-${{ matrix.configuration }}-${{ matrix.arch }}
    secrets:
      GCP_TOKEN: ${{ secrets.GCP_TOKEN }}
      GCP_BUCKETNAME: ${{ secrets.GCP_BUCKETNAME }}

  pack:
    name: call-pack
    needs: [build]
    strategy:
      matrix:
        configuration: [Debug, Release]
    uses: codebeltnet/jobs-dotnet-pack/.github/workflows/default.yml@v3
    with:
      ref: ${{ inputs.ref }}
      configuration: ${{ matrix.configuration }}
      version: ${{ needs.build.outputs.version }}
      download-build-artifact-pattern: build-${{ matrix.configuration }}-X64
      # Keep verification packages separate from authoritative release products in the same run.
      upload-packed-artifact-name: Verification-NuGet-${{ matrix.configuration }}


  test_linux:
    name: call-test-linux
    needs: [build, prepare_test]
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        project: ${{ fromJson(needs.prepare_test.outputs.json) }}
        arch: [X64, ARM64]
    uses: codebeltnet/jobs-dotnet-test/.github/workflows/default.yml@v3
    with:
      ref: ${{ inputs.ref }}
      runs-on: ${{ matrix.arch == 'ARM64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
      configuration: ${{ matrix.configuration }}
      build-switches: -p:SkipSignAssembly=true
      projects: ${{ matrix.project }}
      build: true # we need to build due to xUnitv3
      restore: true # we need to restore since we disabled caching
      download-pattern: build-${{ matrix.configuration }}-${{ matrix.arch }}

  test_windows:
    name: call-test-windows
    needs: [build, prepare_test]
    strategy:
      fail-fast: false
      matrix:
        arch: [X64, ARM64]
        configuration: [Debug, Release]
        project: ${{ fromJson(needs.prepare_test.outputs.json) }}
    uses: codebeltnet/jobs-dotnet-test/.github/workflows/default.yml@v3
    with:
      ref: ${{ inputs.ref }}
      runs-on: ${{ matrix.arch == 'ARM64' && 'windows-11-arm' || 'windows-2025' }}
      configuration: ${{ matrix.configuration }}
      build-switches: -p:SkipSignAssembly=true
      projects: ${{ matrix.project }}
      build: true # we need to build for .net48
      restore: true # apparently we need to restore for .net48
      download-pattern: build-${{ matrix.configuration }}-${{ matrix.arch }}

  test_mac:
    if: ${{ needs.init.outputs.run-mac-tests == 'true' }}
    name: call-test-mac
    needs: [init, build, prepare_test]
    strategy:
      fail-fast: false
      matrix:
        arch: [X64, ARM64]
        configuration: [Debug, Release]
        project: ${{ fromJson(needs.prepare_test.outputs.json) }}
    uses: codebeltnet/jobs-dotnet-test/.github/workflows/default.yml@v3
    with:
      ref: ${{ inputs.ref }}
      runs-on: ${{ matrix.arch == 'ARM64' && 'macos-26' || 'macos-26-intel' }}
      configuration: ${{ matrix.configuration }}
      build-switches: -p:SkipSignAssembly=true
      projects: ${{ matrix.project }}
      build: true # we need to build due to xUnitv3
      restore: true # we need to restore since we disabled caching
      download-pattern: build-${{ matrix.configuration }}-${{ matrix.arch }}

  integration_test:
    if: ${{ needs.init.outputs.run-privileged-jobs == 'true' }}
    name: ⚗️ Integration Test
    needs: [init, build]
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        project: [ test/**/Cuemon.Data.SqlClient.Tests.csproj ]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3

      - name: Install .NET Tool - Report Generator
        uses: codebeltnet/dotnet-tool-install-reportgenerator@v1

      - name: Spin up SQL Server test dependency for ${{ matrix.configuration }} build
        uses: codebeltnet/docker-compose@v1
        with:
          command: up
          options: --wait
        env:
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-${{ matrix.configuration }}-X64
          merge-multiple: true

      - name: Fix Linux test apphost permissions
        run: |
          set -euo pipefail

          echo "=== Context ==="
          echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
          echo "Configuration: ${{ matrix.configuration }}"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "PWD: $(pwd)"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo

          echo "=== .NET info ==="
          dotnet --info || true
          echo

          echo "=== Git state ==="
          git rev-parse HEAD || true
          git status --porcelain || true
          git rev-parse --is-shallow-repository || true
          echo

          # Paths we care about
          BIN_GLOB="*/bin/*/net*/*"
          OBJ_GLOB="*/obj/*/net*/*"

          echo "=== Brute-force chmod (bin + obj) ==="
          find . -type f \( -path "$BIN_GLOB" -o -path "$OBJ_GLOB" \) -exec chmod a+x {} + 2>/dev/null || true
          echo "chmod completed (errors ignored)."
          echo

          echo "=== Mount options (look for noexec) ==="
          # If binaries live on a noexec mount, chmod won't help.
          mount | sed -n '1,200p' || true
          echo

          echo "=== Candidate executables (top 200) ==="
          # Show what we might execute; exclude obvious managed files
          find . -type f -path "$BIN_GLOB" \
            ! -name "*.dll" ! -name "*.pdb" ! -name "*.json" ! -name "*.xml" \
            -printf "%m %u:%g %s %p\n" | head -n 200 || true
          echo

          echo "=== Likely xUnit / test hosts (if present) ==="
          # These names vary; do not rely on just *Tests*
          find . -type f -path "$BIN_GLOB" \( \
              -name "testhost*" -o \
              -name "*xunit*" -o \
              -name "*Tests*" -o \
              -name "*.runsettings" \
            \) -printf "%m %u:%g %s %p\n" | head -n 200 || true
          echo

          echo "=== Deep diagnostics for any 'testhost' or apphost candidates ==="
          # For each likely executable, show the facts that explain 'permission denied' vs 'exec format error'
          while IFS= read -r f; do
            echo "--- $f ---"
            ls -la "$f" || true

            # Identify file type and architecture
            file -L "$f" || true

            # If it's an ELF binary, show its dynamic interpreter and linked libs (exec format errors often show up here)
            if file -L "$f" | grep -q "ELF"; then
              echo "readelf -l (interpreter):"
              readelf -l "$f" 2>/dev/null | sed -n '1,80p' || true
              echo "ldd (dependencies):"
              ldd "$f" 2>/dev/null || true
            fi

            # If it's a script, CRLF in the shebang can cause 'Exec format error'
            if head -c 2 "$f" 2>/dev/null | grep -q "#!"; then
              echo "shebang:"
              head -n 1 "$f" | cat -A || true
            fi

            echo
          done < <(
            find . -type f -path "$BIN_GLOB" \( \
              -name "testhost*" -o \
              -name "*xunit*" -o \
              -name "*Tests*" \
            \) | head -n 50
          ) || true

          echo "=== Done diagnostics step ==="
        shell: bash

      - name: Test with ${{ matrix.configuration }} build
        uses: codebeltnet/dotnet-test@v4
        with:
          projects: ${{ matrix.project }}
          configuration: ${{ matrix.configuration }}
          build: true # apparently we need to due to xUnitv3
          restore: true # we need to restore since we disabled caching
        env:
          CONNECTIONSTRINGS__ADVENTUREWORKS: ${{ secrets.DB_ADVENTUREWORKS }}

      - name: Upload Integration Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-Integration-${{ matrix.configuration }}
          path: ${{ runner.temp }}/TestResults

      - name: Take down SQL Server test dependency for ${{ matrix.configuration }} build
        if: always()
        uses: codebeltnet/docker-compose@v1
        with:
          command: down

  test_qualitygate:
    if: ${{ always() }}
    name: test-qualitygate
    needs: [init, test_linux, test_windows, test_mac, integration_test]
    runs-on: ubuntu-26.04
    steps:
      - name: Evaluate test results
        shell: bash
        env:
          RUN_MAC_TESTS: ${{ needs.init.outputs.run-mac-tests }}
          RUN_PRIVILEGED_JOBS: ${{ needs.init.outputs.run-privileged-jobs }}
          TEST_LINUX_RESULT: ${{ needs.test_linux.result }}
          TEST_WINDOWS_RESULT: ${{ needs.test_windows.result }}
          TEST_MAC_RESULT: ${{ needs.test_mac.result }}
          INTEGRATION_TEST_RESULT: ${{ needs.integration_test.result }}
        run: |
          require_success() {
            local job_name="$1"
            local job_result="$2"

            if [[ "$job_result" != "success" ]]; then
              echo "::error::$job_name finished with '$job_result'."
              exit 1
            fi
          }

          require_success_or_skip() {
            local job_name="$1"
            local job_enabled="$2"
            local job_result="$3"

            if [[ "$job_enabled" == "true" ]]; then
              require_success "$job_name" "$job_result"
              return
            fi

            if [[ "$job_result" != "success" && "$job_result" != "skipped" ]]; then
              echo "::error::$job_name finished with '$job_result' while disabled."
              exit 1
            fi
          }

          require_success "test_linux" "$TEST_LINUX_RESULT"
          require_success "test_windows" "$TEST_WINDOWS_RESULT"
          require_success_or_skip "test_mac" "$RUN_MAC_TESTS" "$TEST_MAC_RESULT"
          require_success_or_skip "integration_test" "$RUN_PRIVILEGED_JOBS" "$INTEGRATION_TEST_RESULT"

  sonarcloud:
    if: ${{always() && needs.init.outputs.run-privileged-jobs == 'true' && needs.build.result == 'success' && needs.test_qualitygate.result == 'success'}}
    name: call-sonarcloud
    needs: [init, build, test_qualitygate]
    uses: codebeltnet/jobs-sonarcloud/.github/workflows/default.yml@v3
    with:
      organization: geekle
      projectKey: Cuemon
      version: ${{ inputs.version || needs.build.outputs.version }}
      ref: ${{ inputs.ref }}
      configuration: Debug # Preserve PR's proven analysis build configuration for both callers.
      parameters: >-
        -d:sonar.exclusions='**/obj/**,**/bin/**'
        ${{ inputs.canonical-main && format('-d:sonar.branch.name=main -d:sonar.scm.revision={0}', inputs.ref) || '' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codecov:
    if: ${{always() && needs.init.outputs.run-privileged-jobs == 'true' && needs.build.result == 'success' && needs.test_qualitygate.result == 'success'}}
    name: call-codecov
    needs: [init, build, test_qualitygate]
    uses: codebeltnet/jobs-codecov/.github/workflows/default.yml@v1
    with:
      repository: codebeltnet/cuemon
      configuration: .github/codecov.yml
      ref: ${{ inputs.ref }}
      branch: ${{ inputs.canonical-main && 'main' || '' }}
      commit: ${{ inputs.canonical-main && inputs.ref || '' }}
      fail-on-error: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  codeql:
    if: ${{always() && needs.init.outputs.run-privileged-jobs == 'true' && needs.build.result == 'success' && needs.test_qualitygate.result == 'success'}}
    name: call-codeql
    needs: [init, build, test_qualitygate]
    uses: codebeltnet/jobs-codeql/.github/workflows/default.yml@v3
    with:
      ref: ${{ inputs.ref }}
      analysis-ref: ${{ inputs.canonical-main && 'refs/heads/main' || '' }}
      analysis-sha: ${{ inputs.canonical-main && inputs.ref || '' }}
      configuration: Debug # Same analysis build as SonarCloud and the original PR flow.
      timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

  verification_quality_gate:
    if: ${{ always() }}
    name: Verification quality gate
    needs: [init, build, pack, test_qualitygate, sonarcloud, codecov, codeql]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Evaluate verification results
        shell: bash
        env:
          RUN_PRIVILEGED_JOBS: ${{ needs.init.outputs.run-privileged-jobs }}
          BUILD_RESULT: ${{ needs.build.result }}
          EXPECTED_VERSION: ${{ inputs.version }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          PACK_RESULT: ${{ needs.pack.result }}
          TEST_RESULT: ${{ needs.test_qualitygate.result }}
          SONAR_RESULT: ${{ needs.sonarcloud.result }}
          CODECOV_RESULT: ${{ needs.codecov.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail

          require_success() {
            local job_name="$1"
            local job_result="$2"

            if [[ "$job_result" != "success" ]]; then
              echo "::error::$job_name finished with '$job_result'."
              exit 1
            fi
          }

          require_skipped() {
            local job_name="$1"
            local job_result="$2"

            if [[ "$job_result" != "skipped" ]]; then
              echo "::error::$job_name finished with '$job_result' for a run that is not authorized to use privileged integrations."
              exit 1
            fi
          }

          require_success "build" "$BUILD_RESULT"
          require_success "pack" "$PACK_RESULT"
          if [[ -n "$EXPECTED_VERSION" && "$BUILD_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Verification MinVer '$BUILD_VERSION' does not match released SemVer '$EXPECTED_VERSION'."
            exit 1
          fi
          require_success "test_qualitygate" "$TEST_RESULT"

          if [[ "$RUN_PRIVILEGED_JOBS" == "true" ]]; then
            require_success "sonarcloud" "$SONAR_RESULT"
            require_success "codecov" "$CODECOV_RESULT"
            require_success "codeql" "$CODEQL_RESULT"
          else
            require_skipped "sonarcloud" "$SONAR_RESULT"
            require_skipped "codecov" "$CODECOV_RESULT"
            require_skipped "codeql" "$CODEQL_RESULT"
          fi

      - name: Verify service records for main at the released SHA
        if: ${{ inputs.canonical-main }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Upload completion can precede service-side processing. Bound the wait.
          for attempt in {1..20}; do
            sonar_ok=false
            codecov_ok=false
            codeql_ok=false
            # Newer main analyses must not hide the released revision, including on later pages.
            sonar_page=1
            while sonar="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "https://sonarcloud.io/api/project_analyses/search?project=Cuemon&branch=main&ps=100&p=$sonar_page")"; do
              if jq -e --arg sha "$RELEASE_SHA" --arg version "$RELEASE_VERSION" \
                'any(.analyses[]; .revision == $sha and .projectVersion == $version)' <<< "$sonar" >/dev/null; then
                sonar_ok=true
                break
              fi
              if ! jq -e '.paging.pageIndex * .paging.pageSize < .paging.total' <<< "$sonar" >/dev/null; then
                break
              fi
              sonar_page=$((sonar_page + 1))
            done
            if codecov="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "https://api.codecov.io/api/v2/github/codebeltnet/repos/cuemon/commits/$RELEASE_SHA/")" &&
               jq -e --arg sha "$RELEASE_SHA" \
                 '.branch == "main" and .commitid == $sha and .state == "complete"' <<< "$codecov" >/dev/null; then
              codecov_ok=true
            fi
            if codeql="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/code-scanning/analyses?tool_name=CodeQL&ref=refs%2Fheads%2Fmain&per_page=100")" &&
               jq -e --arg sha "$RELEASE_SHA" \
                 'any(.[][]; .tool.name == "CodeQL" and .ref == "refs/heads/main" and .commit_sha == $sha and .error == "")' <<< "$codeql" >/dev/null; then
              codeql_ok=true
            fi
            echo "Service identity check $attempt/20 for $RELEASE_SHA: SonarCloud=$sonar_ok; Codecov=$codecov_ok; CodeQL=$codeql_ok"
            if [[ "$sonar_ok" == true && "$codecov_ok" == true && "$codeql_ok" == true ]]; then
              {
                echo '## Post-release service identity verified'
                echo "- SonarCloud: main; SCM revision \`$RELEASE_SHA\`; project version \`$RELEASE_VERSION\`"
                echo "- Codecov: main; commit \`$RELEASE_SHA\`"
                echo "- CodeQL: refs/heads/main; commit \`$RELEASE_SHA\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$attempt" -lt 20 ]]; then sleep 15; fi
          done
          echo "::error::Services did not confirm canonical main at released SHA '$RELEASE_SHA' (SonarCloud=$sonar_ok; Codecov=$codecov_ok; CodeQL=$codeql_ok). Inspect service records; successful uploads alone do not establish assurance."
          exit 1

      - name: Report verified success
        shell: bash
        run: |
          {
            echo "## Shared verification passed"
            echo
            echo "Build and package validation passed. Required Linux and Windows tests passed; optional macOS and trusted-repository checks followed the workflow inputs and fork policy."
          } >> "$GITHUB_STEP_SUMMARY"
